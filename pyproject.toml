[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "inspectcode-tui"
version = "2.0.0"
description = "TUI for JetBrains InspectCode results"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.40",
    "rich>=13.0",
    "textual-themes @ git+https://github.com/michaelblaess/textual-themes.git",
]

[project.scripts]
inspectcode-tui = "inspectcode_tui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
